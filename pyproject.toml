[project]
name = "kickoff"
version = "0.1.0"
description = "CLI to check out football info"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "requests-cache>=1.3.2",
    "textual>=8.2.7",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "textual-dev>=1.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
